<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta
      name="description"
      content="ARC plans your month of marketing, writes the posts, ads, emails and articles, and tracks what each channel brings in. Built for growing businesses in the UAE. Nothing goes out until you approve it."
    />
    <meta property="og:site_name" content="ARC" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ARC: Know which marketing drives growth. We'll do the rest." />
    <meta property="og:description" content="ARC plans your month of marketing, writes the posts, ads, emails and articles, and tracks what each channel brings in. Nothing goes out until you approve it." />
    <meta name="twitter:card" content="summary" />
    <title>ARC: Strategy. Plan. Execution.</title>
    <script>
      // Apply the saved theme and accent before first paint (see src/lib/theme.ts; same keys).
      (function () {
        try {
          var pref = localStorage.getItem('arc-theme')
          var theme = pref === 'light' || pref === 'dark' ? pref
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          var root = document.documentElement
          root.setAttribute('data-theme', theme)
          var vars = JSON.parse(localStorage.getItem('arc-accent-vars') || 'null')
          if (vars && vars[theme]) for (var k in vars[theme]) if (/^--color-[a-z0-9-]+$/.test(k)) root.style.setProperty(k, vars[theme][k])
          document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#f8fafc' : '#08090b')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
