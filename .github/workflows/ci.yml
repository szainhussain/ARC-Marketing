name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt pip-audit
      - name: Tests
        run: python -m pytest -q
      - name: Migrations apply to a fresh database
        env:
          FLASK_APP: wsgi.py
          DATABASE_URL: sqlite:///ci.db
        run: flask db upgrade && flask seed-plans
      - name: Dependency audit
        run: pip-audit -r requirements-dev.txt || true  # report-only until triaged

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high || true  # report-only until triaged

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:5000/api/v1
        run: npx vite --port 5174 --strictPort &
      - name: E2E journey (fixture AI provider)
        env:
          FRONTEND_ORIGIN: http://localhost:5174
        run: bash scripts/run_e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: frontend/e2e/screenshots
