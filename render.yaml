# Render Blueprint — free tier: one web service that also runs the agent
# worker in-process. Database and file storage: a free Supabase project
# (Postgres via its Session pooler URL as DATABASE_URL, plus a private
# Storage bucket). See docs/DEPLOYMENT.md "Free hosting".
services:
  - type: web
    name: arc-api
    runtime: python
    plan: free
    region: virginia      # same area as the Supabase project (AWS us-east-1)
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      flask db upgrade && flask seed-plans &&
      gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_APP
        value: wsgi.py
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # Supabase > Connect > Session pooler URI (IPv4), with your DB password
      - key: STORAGE_BACKEND
        sync: false          # set to "supabase" once the two SUPABASE_ values below are in
      - key: SUPABASE_URL
        sync: false          # e.g. https://<project-ref>.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false          # Supabase > Project Settings > API Keys > secret key (server only)
      - key: SUPABASE_STORAGE_BUCKET
        value: arc-uploads   # create it as a PRIVATE bucket
      - key: FRONTEND_ORIGIN
        sync: false          # e.g. https://arc-marketing.vercel.app (comma-separate several)
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false          # paste your Groq key
      - key: RUN_EMBEDDED_WORKER
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: None          # frontend and API are on different domains
      - key: WTF_CSRF_SSL_STRICT
        value: "false"       # same reason; CSRF token + CORS still enforced
      - key: GEMINI_API_KEY
        sync: false          # free key from aistudio.google.com: turns on on-brand image generation
      - key: WORDPRESS_CLIENT_ID
        sync: false          # from developer.wordpress.com/apps (your WordPress.com app)
      - key: WORDPRESS_CLIENT_SECRET
        sync: false          # same app; secret, Render only
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true  # any long random value; encrypts connected-site tokens at rest
      - key: PLATFORM_ADMIN_EMAILS
        sync: false          # your email(s), comma-separated: opens the in-app Admin inbox
      - key: BILLING_PROVIDER
        value: test
      - key: AI_TIMEOUT_SECONDS
        value: "60"
