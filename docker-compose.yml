services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: marketing_harness
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d marketing_harness"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      FLASK_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key-change-me}
      DATABASE_URL: postgresql://harness:harness@postgres:5432/marketing_harness
      FRONTEND_ORIGIN: http://localhost:5173
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-test}
      UPLOAD_DIR: /app/storage/uploads
    volumes:
      - uploads:/app/storage/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: flask --app wsgi.py worker
    environment:
      FLASK_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key-change-me}
      DATABASE_URL: postgresql://harness:harness@postgres:5432/marketing_harness
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
